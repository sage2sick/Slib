<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Slib.</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="./favicon_io/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon_io/favicon-16x16.png">

</head>

<body>
  <header>
    <div>
      <h1><a class="logo" href="#/">Slib.</a></h1>
      <div class="mut" id="usage">Stored locally in your browser</div>
    </div>
    <button class="pri" id="newF">+</button>
  </header>
  <div id="notice" role="region" aria-label="Cookie notice" hidden>
    <span>This site uses no cookies and no tracking. Your library is saved in
      your browser's storage on this device so the app can work. See the
      <a href="#/cookies">Cookie Policy</a>.</span><button type="button" class="pri" id="noticeOk">Got it</button>
  </div>
  <main id="app">
    <nav id="side" aria-label="Folders"></nav>
    <section>
      <div id="head"></div>
      <button type="button" id="drop">
        Click to pick files, or drop files and folders here
      </button>
      <div id="selbar" role="region" aria-label="Selection actions" hidden>
        <span id="selc"></span><select id="moveTo" aria-label="Move selected files to folder"></select><button
          id="selAll">Select all</button><button id="rmSel">Remove</button><button id="clr">Cancel</button>
      </div>

      <div id="emptySel"></div>
      <div id="list"></div>
    </section>
  </main>
  <div id="page" hidden></div>
  <footer>
    <nav aria-label="Legal">
      <a href="#/privacy">Privacy Policy</a><a href="#/terms">Terms of Service</a><a href="#/cookies">Cookie Policy</a>
    </nav>
    <div>
      &copy; <span id="yr"></span> Slib. All rights reserved.
    </div>
  </footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="player">
    <div class="in">
      <div id="title"></div>
      <div class="ctl">
        <span class="mut" id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0"
          aria-label="Seek" /><span class="mut" id="dur">0:00</span>
      </div>
      <div class="ctl" style="justify-content: center">
        <button class="ic" id="prev" type="button" aria-label="Previous track">
          <svg viewBox="0 0 24 24">
            <path d="M6 5h2v14H6zM20 5v14L9 12z" />
          </svg>
        </button>
        <button class="ic pri" id="play" type="button" aria-label="Play"></button>
        <button class="ic" id="next" type="button" aria-label="Next track">
          <svg viewBox="0 0 24 24">
            <path d="M16 5h2v14h-2zM4 5l11 7L4 19z" />
          </svg>
        </button>
        <div class="vol">
          <div class="vpop">
            <div class="vbox">
              <input type="range" id="vol" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
            </div>
          </div>
          <button class="ic" id="mute" type="button"></button>
        </div>
      </div>
    </div>
  </div>
  <input type="file" id="fi" multiple accept="audio/*,.flac,.m4a,.aac,.opus,.aiff" hidden />
  <input type="file" id="fimg" accept="image/*" multiple hidden />
  <script src="./app.js"></script>
</body>

</html>
